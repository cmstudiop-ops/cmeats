<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff590c"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>CM EATS — Nkomazi Food Delivery</title></head><body><div class="shell"><header><div class="brand"><span class="mark">✦</span><strong>CM <em>EATS</em></strong></div><button id="account" class="circle" aria-label="Account">♙</button></header><main><section id="home"><div class="location"><small>DELIVERING TO</small><b>📍 Nkomazi <span>⌄</span></b></div><div class="hero"><div><small>YOUR FAVOURITES, DELIVERED</small><h1>Hungry?<br>We've got you.</h1><p>Delicious local food, just a tap away.</p><button id="browse" class="light">Explore restaurants →</button></div><span class="hero-art">🍗</span></div><label class="search"><span>⌕</span><input id="search" placeholder="Search restaurants or food…" autocomplete="off"></label><div class="sectionhead"><h2>What are you craving?</h2></div><div id="categories" class="chips"></div><div class="sectionhead"><h2>Restaurants near you</h2><span id="count"></span></div><div id="restaurants" class="restaurants"><div class="empty">Loading restaurants…</div></div></section><section id="restaurant" hidden><button class="back" data-go="home">← Back</button><div id="restaurantContent"></div></section><section id="cart" hidden><h1>Your cart</h1><div id="cartContent"></div></section><section id="orders" hidden><h1>My orders</h1><div id="ordersContent"></div></section><section id="profile" hidden><h1>My profile</h1><div id="profileContent"></div></section></main><nav class="bottom"><button data-go="home" class="active"><span>⌂</span>Home</button><button data-go="cart"><span>▣</span>Cart <sup id="cartCount"></sup></button><button data-go="orders"><span>▤</span>Orders</button><button data-go="profile"><span>♙</sp
